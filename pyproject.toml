[project]
name = "document-processor"
version = "0.1.0"
description = "LangGraph document processor with Azure AI services"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langsmith>=0.1",
    "langchain-openai>=0.2",
    "azure-storage-blob>=12.0",
    "azure-ai-documentintelligence>=1.0",
    "azure-search-documents>=11.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "jinja2>=3.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
